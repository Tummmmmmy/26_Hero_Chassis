<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240">
<style>
  .t{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#111827;}
  .title{font-size:30px;font-weight:700;}
  .sub{font-size:13.5px;fill:#6b7280;}
  .devt{font-size:16px;font-weight:600;}
  .devs{font-size:12.5px;fill:#6b7280;}
  .lbl{font-size:12px;fill:#2563eb;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;}
  .canlbl{font-size:14px;font-weight:700;fill:#059669;}
  .note{font-size:12.5px;fill:#4b5563;}
  .box{fill:#f9fafb;stroke:#9ca3af;stroke-width:1.5;}
  .cbox{fill:#ffffff;stroke:#059669;stroke-width:1.5;}
  .mcu{fill:#eef2ff;stroke:#4338ca;stroke-width:2;}
  .wire{stroke:#2563eb;stroke-width:2;fill:none;}
  .can{stroke:#059669;stroke-width:3;fill:none;}
  .note-box{fill:#fbfbfc;stroke:#d1d5db;stroke-width:1.5;stroke-dasharray:5 5;}
</style>
<defs>
  <marker id="ab" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
</defs>
<rect x="0" y="0" width="1800" height="1240" fill="#ffffff"/>
<text class="t title" x="60" y="62">26_Hero_Chassis 系统连接与通信拓扑</text>
<text class="t sub" x="60" y="92">STM32H723VGT6 · RoboMaster 英雄机器人底盘板 · 通信关系示意（不含供电与连接器）</text>

<!-- ===== MCU ===== -->
<rect class="mcu" x="640" y="340" width="400" height="360" rx="14"/>
<text class="t" x="660" y="378" font-size="22" font-weight="700">STM32H723VGT6</text>
<text class="t" x="660" y="404" font-size="13" fill="#4b5563">Cortex-M7 480 MHz · FreeRTOS</text>
<line x1="660" y1="424" x2="1020" y2="424" stroke="#c7d2fe" stroke-width="1.5"/>
<text class="t" x="660" y="465" font-size="13.5" fill="#374151">底盘运动闭环 · 1 ms</text>
<text class="t" x="660" y="497" font-size="13.5" fill="#374151">功率分配 · 超级电容 · 上坎</text>
<text class="t" x="660" y="529" font-size="13.5" fill="#374151">云台指令接收 · 状态回传</text>
<line x1="660" y1="558" x2="1020" y2="558" stroke="#c7d2fe" stroke-width="1.5"/>
<text class="t" x="660" y="592" font-size="12.5" fill="#6b7280">FDCAN ×3 · UART ×2 · SPI ×2 · GPIO · PWM</text>

<!-- ===== 左侧：裁判 / 调试 / IMU ===== -->
<rect class="box" x="60" y="105" width="240" height="90" rx="10"/>
<text class="t devt" x="78" y="133">裁判系统</text>
<text class="t devs" x="78" y="157">底盘功率 · 缓冲能量</text>
<text class="t devs" x="78" y="180">UART1 · 115200 · 双向</text>
<path class="wire" d="M300 150 H380 V390 H640" marker-end="url(#ab)"/>
<text class="t lbl" x="480" y="382">UART1</text>

<rect class="box" x="60" y="215" width="240" height="90" rx="10"/>
<text class="t devt" x="78" y="243">匿名上位机 / VOFA+</text>
<text class="t devs" x="78" y="267">调试波形与日志</text>
<text class="t devs" x="78" y="290">UART10 · 115200</text>
<path class="wire" d="M640 460 H340 V260 H300" marker-end="url(#ab)"/>
<text class="t lbl" x="352" y="252">UART10</text>

<rect class="box" x="60" y="465" width="240" height="90" rx="10"/>
<text class="t devt" x="78" y="493">BMI088 IMU</text>
<text class="t devs" x="78" y="517">加速度 / 陀螺仪</text>
<text class="t devs" x="78" y="540">SPI2 · 板载姿态</text>
<line class="wire" x1="300" y1="510" x2="640" y2="510" marker-end="url(#ab)"/>
<text class="t lbl" x="474" y="500">SPI2</text>

<!-- ===== 右侧：说明 / 到位检测 / 气动 / 状态指示 ===== -->
<rect class="note-box" x="1240" y="90" width="440" height="150" rx="10"/>
<text class="t devt" x="1258" y="118">整车指令来源</text>
<text class="t devs" x="1258" y="142">DR16 / VT03 / 视觉 → 云台板</text>
<text class="t devs" x="1258" y="164">云台板 → FDCAN1 → 底盘板</text>
<text class="t devs" x="1258" y="186">底盘板不直接连接遥控器与视觉</text>

<rect class="box" x="1240" y="330" width="440" height="100" rx="10"/>
<text class="t devt" x="1258" y="358">到位检测</text>
<text class="t devs" x="1258" y="382">SICK GTB2S-N1451</text>
<text class="t devs" x="1258" y="404">漫反射光电 · GPIO 输入</text>
<line class="wire" x1="1240" y1="380" x2="1040" y2="380" marker-end="url(#ab)"/>
<text class="t lbl" x="1088" y="370">GPIO · PE9</text>

<rect class="box" x="1240" y="470" width="440" height="110" rx="10"/>
<text class="t devt" x="1258" y="498">气动上坎机构</text>
<text class="t devs" x="1258" y="522">前 / 后气缸 · GPIO</text>
<text class="t devs" x="1258" y="544">比例阀 · TIM1_CH3 PWM</text>
<line class="wire" x1="1040" y1="525" x2="1240" y2="525" marker-end="url(#ab)"/>
<text class="t lbl" x="1098" y="515">GPIO / PWM</text>

<rect class="box" x="1240" y="610" width="440" height="90" rx="10"/>
<text class="t devt" x="1258" y="638">状态指示</text>
<text class="t devs" x="1258" y="662">WS2812 状态灯 · SPI6</text>
<text class="t devs" x="1258" y="685">蜂鸣器 · TIM12_CH2</text>
<line class="wire" x1="1040" y1="655" x2="1240" y2="655" marker-end="url(#ab)"/>
<text class="t lbl" x="1098" y="645">SPI6 / PWM</text>

<!-- ===== CAN ===== -->
<path class="can" d="M840 700 V780 H1500 V1100"/>
<line class="can" x1="100" y1="860" x2="1500" y2="860"/>
<line class="can" x1="100" y1="980" x2="1500" y2="980"/>
<line class="can" x1="100" y1="1100" x2="1500" y2="1100"/>
<circle cx="1500" cy="860" r="4" fill="#059669"/>
<circle cx="1500" cy="980" r="4" fill="#059669"/>

<text class="t canlbl" x="1050" y="850">FDCAN1</text>
<text class="t canlbl" x="1050" y="970">FDCAN2</text>
<text class="t canlbl" x="1050" y="1090">FDCAN3</text>

<rect class="cbox" x="140" y="815" width="300" height="90" rx="8"/>
<text class="t devt" x="158" y="843">云台主控板</text>
<text class="t devs" x="158" y="867">0x300/0x308 ↔ 0x304/0x302</text>
<text class="t devs" x="158" y="891">整机指令 · 拨盘转发</text>

<rect class="cbox" x="140" y="935" width="300" height="90" rx="8"/>
<text class="t devt" x="158" y="963">底盘电机 ×4</text>
<text class="t devs" x="158" y="987">大疆 M3508</text>
<text class="t devs" x="158" y="1011">0x200 ↔ 0x201–0x204</text>

<rect class="cbox" x="470" y="935" width="250" height="90" rx="8"/>
<text class="t devt" x="488" y="963">超级电容</text>
<text class="t devs" x="488" y="987">SCCM V2.0</text>
<text class="t devs" x="488" y="1011">0x600 ↔ 0x601 · 充放电</text>

<rect class="cbox" x="750" y="935" width="250" height="90" rx="8"/>
<text class="t devt" x="768" y="963">功率计</text>
<text class="t devs" x="768" y="987">SEASKY INA226</text>
<text class="t devs" x="768" y="1011">0x301 · 数据采集</text>

<rect class="cbox" x="140" y="1055" width="300" height="90" rx="8"/>
<text class="t devt" x="158" y="1083">拨盘电机</text>
<text class="t devs" x="158" y="1107">达妙 DM4340</text>
<text class="t devs" x="158" y="1131">0x207/0x07 ↔ 0x17</text>

<!-- ===== 图例 ===== -->
<line class="wire" x1="60" y1="1192" x2="110" y2="1192"/>
<text class="t note" x="120" y="1196">UART / SPI / GPIO</text>
<line class="can" x1="290" y1="1192" x2="340" y2="1192"/>
<text class="t note" x="350" y="1196">FDCAN</text>
<line x1="450" y1="1192" x2="500" y2="1192" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 5"/>
<text class="t note" x="510" y="1196">说明</text>
<text class="t note" x="620" y="1196">箭头 = 数据方向 · 底盘板不直连遥控器与视觉</text>
</svg>